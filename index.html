<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historia de la Copa Libertadores</title>
<!-- Para buscadores (Google) y para la vista previa al compartir el link -->
<meta name="description" content="Historia completa de la Copa Libertadores desde 1960: todas las finales y campeones, la historia de cada club, tablas de grupos, partidos, goleadores, asistidores y planteles de cada edición.">
<meta property="og:type" content="website">
<meta property="og:locale" content="es_AR">
<meta property="og:site_name" content="Historia de la Copa Libertadores">
<meta property="og:title" content="Historia de la Copa Libertadores">
<meta property="og:description" content="Todas las ediciones desde 1960: finales, campeones, grupos, partidos, goleadores y planteles.">
<meta property="og:url" content="https://santino-uncal.github.io/FULBO/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "WebSite", "name": "Historia de la Copa Libertadores",
 "url": "https://santino-uncal.github.io/FULBO/", "inLanguage": "es"}
</script>
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>
<header class="cabecera">
  <p class="cabecera-eyebrow">Desde 1960</p>
  <h1><a class="inicio" href="index.html" title="Ir a la edición actual">Copa Libertadores</a></h1>
  <p class="cabecera-lema">La Gloria Eterna</p>
  <p class="cabecera-sub">Todas las ediciones, partidos, goleadores y planteles</p>
</header>

<main>
  <div class="barra-superior">
  <div class="buscador">
    <input id="buscar-equipo" type="search" placeholder="🔎 Buscar equipo (ej.: river)" autocomplete="off"
      aria-label="Buscar equipo" aria-controls="sugerencias" aria-autocomplete="list">
    <ul class="sugerencias" id="sugerencias" role="listbox" hidden></ul>
  </div>
  <a class="boton-estadisticas" id="boton-estadisticas" href="?estadisticas">📊 Estadísticas históricas</a>
  <div class="grupo-anios">
    <button class="flecha-anio" id="anio-anterior" type="button" aria-label="Año anterior" title="Año anterior" disabled>◀</button>
    <button class="boton-anios" id="boton-anios" type="button" aria-expanded="false" aria-controls="panel-anios">📅 <span id="anio-actual">Años</span> ▾</button>
    <button class="flecha-anio" id="anio-siguiente" type="button" aria-label="Año siguiente" title="Año siguiente" disabled>▶</button>
    <button class="ultimo-anio ultimo-anio-barra" type="button" hidden>↩ <span></span></button>
  </div>
  </div>
  <!-- Panel de años: arranca cerrado y se abre con el botón 📅 -->
  <div class="panel-anios" id="panel-anios" hidden>
    <div class="fila-buscar-anio">
      <input id="buscar-anio" type="search" inputmode="numeric" maxlength="4" placeholder="Escribí un año (ej.: 1986)"
        autocomplete="off" aria-label="Buscar año">
      <!-- Vuelve al último año que se estuvo mirando antes del actual (se recuerda entre visitas) -->
      <button class="ultimo-anio" type="button" hidden>↩ Último visto: <span></span></button>
    </div>
    <nav class="ediciones" id="ediciones" aria-label="Ediciones"></nav>
    <p class="vacio" id="anio-vacio" hidden>No hay ninguna edición con ese año.</p>
  </div>
  <section class="edicion" id="edicion">
    <p class="vacio">Elegí una edición.</p>
  </section>
</main>

<!-- Orden de carga: datos → lógica (no cambiarlo) -->
<script src="data/indice.js"></script>
<script src="data/equipos.js"></script>
<script src="data/colores.js"></script>
<script src="data/entrenadores.js"></script>
<script src="data/jugador-torneo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
